<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cage Tracker — X-Profil-Watchlist</title>
<style>
:root{
  --bg:#f5f2ea;
  --surface:#ffffff;
  --surface-2:#efe9db;
  --border:#ddd6c4;
  --text:#201d16;
  --text-dim:#6b6558;
  --accent:#b8720a;
  --accent-soft:rgba(184,114,10,0.12);
  --accent-ink:#ffffff;
  --good:#1f9d6a;
  --good-soft:rgba(31,157,106,0.12);
  --bad:#c8323a;
  --bad-soft:rgba(200,50,58,0.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0c10;
    --surface:#17161c;
    --surface-2:#201f27;
    --border:#2c2b34;
    --text:#f2efe8;
    --text-dim:#9c98a8;
    --accent:#ffb020;
    --accent-soft:rgba(255,176,32,0.14);
    --accent-ink:#171106;
    --good:#34d399;
    --good-soft:rgba(52,211,153,0.14);
    --bad:#f2545b;
    --bad-soft:rgba(242,84,91,0.14);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c10; --surface:#17161c; --surface-2:#201f27; --border:#2c2b34;
  --text:#f2efe8; --text-dim:#9c98a8; --accent:#ffb020; --accent-soft:rgba(255,176,32,0.14);
  --accent-ink:#171106; --good:#34d399; --good-soft:rgba(52,211,153,0.14);
  --bad:#f2545b; --bad-soft:rgba(242,84,91,0.14);
}
:root[data-theme="light"]{
  --bg:#f5f2ea; --surface:#ffffff; --surface-2:#efe9db; --border:#ddd6c4;
  --text:#201d16; --text-dim:#6b6558; --accent:#b8720a; --accent-soft:rgba(184,114,10,0.12);
  --accent-ink:#ffffff; --good:#1f9d6a; --good-soft:rgba(31,157,106,0.12);
  --bad:#c8323a; --bad-soft:rgba(200,50,58,0.12);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;}
h1,h2,h3{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-wrap:balance;margin:0;}
button{font:inherit;color:inherit;}
input{font:inherit;color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.topbar{
  position:sticky; top:0; z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(6px);
}
.topbar-inner{
  max-width:820px; margin:0 auto; padding:16px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.wordmark{
  display:flex; align-items:baseline; gap:2px; cursor:pointer; background:none; border:none; padding:0;
}
.wordmark-text{
  font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  font-weight:800; font-size:22px; letter-spacing:0.1em; color:var(--text);
}
.wordmark-cursor{color:var(--accent); animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.wordmark-sub{font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim); margin-left:8px;}

.tabs{display:flex; gap:4px;}
.tab-btn{
  background:none; border:1px solid transparent; padding:8px 14px; cursor:pointer;
  font-size:13px; font-weight:600; letter-spacing:0.02em; color:var(--text-dim); border-radius:2px;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--text); border-color:var(--border); background:var(--surface);}

.stats-readout{display:flex; align-items:center; gap:14px;}

.reset-btn{
  background:none; border:1px solid var(--border); color:var(--text-dim); font-size:11px;
  padding:7px 10px; cursor:pointer; border-radius:2px; letter-spacing:0.02em;
}
.reset-btn:hover{color:var(--bad); border-color:var(--bad);}

.app{max-width:820px; margin:0 auto; padding:28px 20px 100px;}

.hero-line{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent);}
.hero-title{font-size:26px; font-weight:800; letter-spacing:-0.01em; margin:6px 0 6px;}
.hero-sub{color:var(--text-dim); font-size:14px; max-width:60ch; margin-bottom:28px;}

.btn{
  background:var(--accent); color:var(--accent-ink); border:none; padding:10px 18px;
  font-weight:700; font-size:13px; letter-spacing:0.02em; cursor:pointer; border-radius:2px;
  transition:filter .15s ease, transform .1s ease;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:0.4; cursor:not-allowed; filter:none;}
.btn-ghost{
  background:none; color:var(--text); border:1px solid var(--border); padding:8px 14px;
  font-weight:700; font-size:12px; cursor:pointer; border-radius:2px;
}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent);}

.panel{background:var(--surface); border:1px solid var(--border); padding:22px;}

.wl-form{display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;}
.wl-input{
  flex:1; min-width:220px; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:11px 14px; font-size:14px; border-radius:2px;
}
.wl-input:focus-visible{border-color:var(--accent);}
.wl-error{color:var(--bad); font-size:12px; margin:-14px 0 18px;}

.wl-list{display:flex; flex-direction:column;}
.wl-row{display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.wl-row:last-child{border-bottom:none;}
.wl-handle{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace; font-weight:800; font-size:14px; flex:1;}
.wl-empty, .feed-empty{color:var(--text-dim); font-size:14px; padding:30px 4px; text-align:center;}

.sound-panel{margin-top:22px;}
.sound-label{font-size:12px; color:var(--text-dim); margin-bottom:12px;}
.sound-options{display:flex; gap:8px; flex-wrap:wrap;}
.sound-btn{background:none; border:1px solid var(--border); color:var(--text); padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; border-radius:2px;}
.sound-btn:hover{border-color:var(--accent);}
.sound-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

.feed-list{display:flex; flex-direction:column; gap:14px;}
.feed-item{background:var(--surface); border:1px solid var(--border); padding:18px 20px;}
.feed-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; flex-wrap:wrap;}
.feed-who{display:flex; align-items:center; gap:8px;}
.feed-handle{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace; font-weight:800; font-size:14px; color:var(--accent);}
.avatar-sm{width:24px; height:24px; border-radius:50%; border:1px solid var(--border); object-fit:cover; background:var(--surface-2); flex-shrink:0;}
.feed-time{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em;}
.feed-text{font-size:14px; color:var(--text); margin-bottom:14px; white-space:pre-wrap;}
.feed-link{display:inline-block; font-size:12px; font-weight:700; color:var(--accent-ink); background:var(--accent); padding:8px 14px; border-radius:2px; text-decoration:none;}
.feed-link:hover{filter:brightness(1.08);}

.footnote{margin-top:36px; font-size:12px; color:var(--text-dim); border-top:1px solid var(--border); padding-top:16px;}

.user-chip{display:flex; align-items:center; gap:8px;}
.user-avatar{width:26px; height:26px; border-radius:50%; border:1px solid var(--border); display:block; object-fit:cover; background:var(--surface-2);}
.user-name{font-size:12px; font-weight:700; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.member-count{font-size:11px; color:var(--text-dim); letter-spacing:0.02em; white-space:nowrap;}

.gate-wrap{
  max-width:460px; margin:60px auto 0; text-align:center; background:var(--surface);
  border:1px solid var(--border); padding:40px 32px;
}
.gate-eyebrow{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}
.gate-title{font-size:24px; font-weight:800; letter-spacing:-0.01em; margin-bottom:12px;}
.gate-sub{font-size:14px; color:var(--text-dim); margin-bottom:26px;}
.discord-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--accent); color:var(--accent-ink); border:none; padding:13px 26px;
  font-weight:700; font-size:14px; letter-spacing:0.02em; cursor:pointer; border-radius:2px; width:100%;
}
.discord-btn:hover{filter:brightness(1.08);}
.gate-config-error{max-width:460px; margin:60px auto 0; background:var(--bad-soft); border:1px solid var(--bad); padding:20px 24px; font-size:13px; color:var(--text);}

.loading-wrap{max-width:460px; margin:100px auto 0; text-align:center; color:var(--text-dim); font-size:13px; font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace; letter-spacing:0.04em;}

.toast-container{position:fixed; top:16px; right:16px; z-index:50; display:flex; flex-direction:column; gap:10px; max-width:340px;}
.toast{
  background:var(--surface); border:1px solid var(--accent); box-shadow:0 8px 24px rgba(0,0,0,0.18);
  padding:14px 16px; border-radius:2px; cursor:pointer; animation:toast-in .2s ease;
}
.toast:hover{filter:brightness(1.05);}
.toast-head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.toast-handle{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace; font-weight:800; font-size:13px; color:var(--accent);}
.toast-text{font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
@keyframes toast-in{from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

@media (max-width:520px){
  .hero-title{font-size:22px;}
  .panel{padding:18px;}
  .toast-container{left:16px; right:16px; max-width:none;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <button class="wordmark" id="logoBtn" aria-label="Zur Übersicht">
      <span class="wordmark-text">CAGE<span class="wordmark-cursor">_</span></span>
      <span class="wordmark-sub">Tracker</span>
    </button>
    <div class="tabs" id="tabs">
      <button class="tab-btn" data-view="feed">Feed</button>
      <button class="tab-btn" data-view="watchlist">Watchlist</button>
    </div>
    <div class="stats-readout" id="statsArea"></div>
  </div>
</div>

<div class="app" id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";

var configOk = (typeof SUPABASE_URL === "string" && SUPABASE_URL.indexOf("https://") === 0 &&
                typeof SUPABASE_ANON_KEY === "string" && SUPABASE_ANON_KEY.length > 10 &&
                typeof supabase !== "undefined");
var sb = configOk ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

var auth = { user:null };
var watchlistData = null;
var feedData = null;
var feedChannel = null;
var pushState = "unknown"; // "unknown" | "unsupported" | "off" | "on"
var memberCount = null;

function loadMemberCount(){
  if(!sb) return;
  sb.rpc("get_member_count").then(function(res){
    if(res.error){ console.error("Cage Tracker: Mitglieder-Zähler konnte nicht geladen werden.", res.error); return; }
    memberCount = res.data;
    renderTopbar();
  });
}

function currentDisplayName(){
  if(!auth.user) return "";
  var meta = auth.user.user_metadata || {};
  return meta.full_name || meta.name || (meta.custom_claims && meta.custom_claims.global_name) || auth.user.email || "CAGE-Mitglied";
}
function currentAvatarUrl(){
  if(!auth.user) return null;
  var meta = auth.user.user_metadata || {};
  return meta.avatar_url || null;
}

function loginWithDiscord(){
  if(!sb) return;
  sb.auth.signInWithOAuth({ provider:"discord", options:{ redirectTo: window.location.href } });
}
function logout(){
  if(!sb) return;
  sb.auth.signOut().then(function(){
    teardownSession();
    setView("gate");
  });
}
function teardownSession(){
  auth.user = null;
  watchlistData = null;
  feedData = null;
  pushState = "unknown";
  memberCount = null;
  if(feedChannel){ sb.removeChannel(feedChannel); feedChannel = null; }
}

// --- Browser-Push ---

function urlBase64ToUint8Array(base64String){
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = window.atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for(var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function hasVapidKey(){
  return typeof VAPID_PUBLIC_KEY === "string" && VAPID_PUBLIC_KEY.length > 10 && VAPID_PUBLIC_KEY.indexOf("DEIN-") !== 0;
}

function checkPushState(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !hasVapidKey()){
    pushState = "unsupported";
    renderTopbar();
    return;
  }
  navigator.serviceWorker.register("sw.js").then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    pushState = sub ? "on" : "off";
    renderTopbar();
  }).catch(function(err){
    console.error("Cage Tracker: Service Worker konnte nicht registriert werden.", err);
    pushState = "unsupported";
    renderTopbar();
  });
}

function subscribePush(){
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }).then(function(sub){
    var json = sub.toJSON();
    return sb.from("push_subscriptions").insert({
      user_id: auth.user.id,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth_key: json.keys.auth
    });
  }).then(function(res){
    if(res && res.error && res.error.code !== "23505"){
      console.error("Cage Tracker: Push-Abo konnte nicht gespeichert werden.", res.error);
    }
    pushState = "on";
    renderTopbar();
  }).catch(function(err){
    console.error("Cage Tracker: Push-Anmeldung fehlgeschlagen.", err);
    alert("Push konnte nicht aktiviert werden — hast du die Benachrichtigungs-Erlaubnis im Browser erteilt?");
  });
}

function unsubscribePush(){
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    if(!sub) return;
    var endpoint = sub.endpoint;
    return sub.unsubscribe().then(function(){
      return sb.from("push_subscriptions").delete().eq("endpoint", endpoint);
    });
  }).then(function(){
    pushState = "off";
    renderTopbar();
  }).catch(function(err){
    console.error("Cage Tracker: Push-Abmeldung fehlgeschlagen.", err);
  });
}

function togglePush(){
  if(pushState === "on") unsubscribePush();
  else if(pushState === "off") subscribePush();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function normalizeHandle(raw){
  var s = (raw || "").trim();
  s = s.replace(/^https?:\/\/(www\.)?(x\.com|twitter\.com)\//i, "");
  s = s.replace(/^@/, "");
  s = s.split(/[/?]/)[0];
  return s.toLowerCase();
}

// --- Benachrichtigungston (nur bei offenem Tab, siehe README.md) ---

var SOUND_KEY = "cage-tracker-sound";
var soundChoice = (function(){
  try { return localStorage.getItem(SOUND_KEY) || "off"; } catch(e){ return "off"; }
})();

function setSoundChoice(choice){
  soundChoice = choice;
  try { localStorage.setItem(SOUND_KEY, choice); } catch(e){}
  if(state.view === "watchlist") render();
}

var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// Kurze, selbst erzeugte Signaltöne -- keine Audio-Dateien, kein Netzwerk-Request nötig.
function playTone(freqs){
  var ctx = getAudioCtx();
  if(!ctx) return;
  var t = ctx.currentTime;
  freqs.forEach(function(freq, i){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    var start = t + i * 0.14;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.2, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + 0.13);
  });
}

var SOUNDS = {
  "1": function(){ playTone([880]); },
  "2": function(){ playTone([660, 880]); },
  "3": function(){ playTone([523, 659, 784]); }
};

function playNotificationSound(){
  var fn = SOUNDS[soundChoice];
  if(fn) fn();
}

function timeAgo(iso){
  if(!iso) return "";
  var diffMs = Date.now() - new Date(iso).getTime();
  var min = Math.floor(diffMs / 60000);
  if(min < 1) return "gerade eben";
  if(min < 60) return "vor " + min + " Min.";
  var std = Math.floor(min / 60);
  if(std < 24) return "vor " + std + " Std.";
  var tage = Math.floor(std / 24);
  return "vor " + tage + " Tag" + (tage === 1 ? "" : "en");
}

// --- Watchlist ---

function loadWatchlist(){
  if(!sb || !auth.user) return;
  sb.from("watchlist").select("handle, avatar_url, created_at")
    .order("created_at", { ascending:false })
    .then(function(res){
      if(res.error){
        console.error("Cage Tracker: Watchlist konnte nicht geladen werden.", res.error);
        watchlistData = [];
      } else {
        watchlistData = res.data || [];
      }
      if(state.view === "watchlist") render();
    });
}

// Watchlist-Änderungen laufen über eine Edge Function statt direkter Tabellen-Aufrufe,
// weil dieselbe Function auch das Profil bei twitterapi.io für Echtzeit-Alarme an- bzw.
// abmeldet (siehe supabase/functions/watchlist/index.ts). Das kann spürbar länger dauern
// als ein reiner DB-Aufruf, deshalb der Lade-Zustand am Button.
function handleWatchlistFunctionError(error, errBox, fallbackMessage){
  console.error("Cage Tracker: Watchlist-Funktion meldete einen Fehler.", error);
  if(!errBox) return;
  if(error && error.context && typeof error.context.json === "function"){
    error.context.json().then(function(body){
      errBox.textContent = (body && body.error) || fallbackMessage;
    }).catch(function(){
      errBox.textContent = fallbackMessage;
    });
  } else {
    errBox.textContent = fallbackMessage;
  }
}

function addProfile(){
  var input = document.getElementById("handleInput");
  var addBtn = document.getElementById("addBtn");
  var handle = normalizeHandle(input.value);
  var errBox = document.getElementById("wlError");
  if(!/^[a-z0-9_]{1,15}$/.test(handle)){
    if(errBox) errBox.textContent = "Das sieht nicht nach einem gültigen X-Handle aus (nur Buchstaben, Zahlen, Unterstrich, max. 15 Zeichen).";
    return;
  }
  if(errBox) errBox.textContent = "";
  if(addBtn){ addBtn.disabled = true; addBtn.textContent = "Wird hinzugefügt…"; }
  sb.functions.invoke("watchlist", { body: { action:"add", handle: handle } }).then(function(res){
    if(res.error){
      handleWatchlistFunctionError(res.error, errBox, "Konnte nicht gespeichert werden.");
    } else {
      input.value = "";
      loadWatchlist();
    }
  }).finally(function(){
    if(addBtn){ addBtn.disabled = false; addBtn.textContent = "Hinzufügen"; }
  });
}

function removeProfile(handle){
  if(!sb) return;
  sb.functions.invoke("watchlist", { body: { action:"remove", handle: handle } }).then(function(res){
    if(res.error) console.error("Cage Tracker: Profil konnte nicht entfernt werden.", res.error);
    else loadWatchlist();
  });
}

// --- Feed ---

function loadFeed(){
  if(!sb || !auth.user) return;
  sb.from("posts").select("*")
    .order("detected_at", { ascending:false })
    .limit(50)
    .then(function(res){
      if(res.error){
        console.error("Cage Tracker: Feed konnte nicht geladen werden.", res.error);
        feedData = [];
      } else {
        feedData = res.data || [];
      }
      if(state.view === "feed") render();
    });
}

function subscribeFeed(){
  if(!sb || feedChannel) return;
  feedChannel = sb.channel("cage-tracker-posts")
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"posts" }, function(payload){
      feedData = feedData || [];
      feedData.unshift(payload.new);
      if(feedData.length > 50) feedData.length = 50;
      playNotificationSound();
      showToast(payload.new);
      if(state.view === "feed") render();
    })
    .subscribe();
}

// Kurze Einblendung oben rechts, egal welcher Tab gerade offen ist -- zusätzlich zum
// Live-Feed und der echten Push-Benachrichtigung, damit ein neuer Post auffällt, auch
// wenn man gerade z. B. in der Watchlist ist.
function showToast(post){
  var container = document.getElementById("toastContainer");
  if(!container) return;
  var toast = document.createElement("div");
  toast.className = "toast";
  var html = '<div class="toast-head">';
  html += post.avatar_url ? '<img class="avatar-sm" src="'+escapeHtml(post.avatar_url)+'" alt="">' : '';
  html += '<span class="toast-handle">@'+escapeHtml(post.handle)+'</span>';
  html += '</div>';
  if(post.text_preview) html += '<div class="toast-text">'+escapeHtml(post.text_preview)+'</div>';
  toast.innerHTML = html;
  toast.addEventListener("click", function(){
    window.open(post.post_url, "_blank", "noopener");
  });
  container.appendChild(toast);
  setTimeout(function(){
    if(toast.parentNode) toast.parentNode.removeChild(toast);
  }, 8000);
}

// --- Ansicht ---

var state = { view:"loading" };

function setView(v){
  if(v !== "gate" && v !== "loading" && !auth.user) v = "gate";
  state.view = v;
  render();
  window.scrollTo(0,0);
}

function render(){
  renderTopbar();
  if(state.view === "loading") renderLoading();
  else if(state.view === "gate") renderGate();
  else if(state.view === "feed") renderFeed();
  else if(state.view === "watchlist") renderWatchlist();
}

function renderTopbar(){
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.classList.toggle("active", btn.dataset.view === state.view);
  });
  var area = document.getElementById("statsArea");
  if(!auth.user){
    area.innerHTML = "";
    return;
  }
  var avatar = currentAvatarUrl();
  var html = "";
  if(memberCount !== null) html += '<span class="member-count">'+memberCount+' Mitglieder</span>';
  html += '<div class="user-chip">';
  html += avatar ? '<img class="user-avatar" src="'+escapeHtml(avatar)+'" alt="">' : '';
  html += '<span class="user-name">'+escapeHtml(currentDisplayName())+'</span>';
  html += '</div>';
  if(pushState === "on") html += '<button class="reset-btn" id="pushBtn">🔔 Push an</button>';
  else if(pushState === "off") html += '<button class="reset-btn" id="pushBtn">🔕 Push aktivieren</button>';
  html += '<button class="reset-btn" id="logoutBtn">Abmelden</button>';
  area.innerHTML = html;
  var pushBtn = document.getElementById("pushBtn");
  if(pushBtn) pushBtn.addEventListener("click", togglePush);
  document.getElementById("logoutBtn").addEventListener("click", logout);
}

function renderLoading(){
  document.getElementById("app").innerHTML = '<div class="loading-wrap">Lädt…</div>';
}

function renderGate(){
  var app = document.getElementById("app");
  if(!sb){
    app.innerHTML = '<div class="gate-config-error">Die Seite ist noch nicht fertig eingerichtet: <code>config.js</code> fehlt oder enthält keine gültigen Supabase-Werte. Siehe <code>SETUP.md</code>.</div>';
    return;
  }
  var html = '<div class="gate-wrap">';
  html += '<div class="gate-eyebrow">Cage Tracker</div>';
  html += '<div class="gate-title">Erst anmelden, dann tracken.</div>';
  html += '<div class="gate-sub">Watchlist und Alarme sind für den ganzen CAGE-Discord gemeinsam — melde dich mit Discord an, um mitzumachen.</div>';
  html += '<button class="discord-btn" id="loginBtn">Mit Discord anmelden</button>';
  html += '</div>';
  app.innerHTML = html;
  document.getElementById("loginBtn").addEventListener("click", loginWithDiscord);
}

function renderFeed(){
  if(feedData === null){
    document.getElementById("app").innerHTML = '<div class="loading-wrap">Lädt Feed…</div>';
    loadFeed();
    return;
  }
  var html = "";
  html += '<div class="hero-line"><span class="eyebrow">Live-Feed</span></div>';
  html += '<h1 class="hero-title">Frisch erkannte Posts.</h1>';
  html += '<p class="hero-sub">Neueste zuerst. Mit aktiviertem Push (oben rechts 🔕) bekommst du zusätzlich eine Browser-Benachrichtigung, sobald etwas Neues reinkommt — hier siehst du den Verlauf, auch wenn du den Moment verpasst hast.</p>';
  if(feedData.length === 0){
    html += '<div class="feed-empty">Noch nichts erkannt. Sobald ein Profil auf der Watchlist postet, taucht es hier auf.</div>';
  } else {
    html += '<div class="feed-list">';
    feedData.forEach(function(post){
      html += '<div class="feed-item">';
      html += '<div class="feed-head">';
      html += '<span class="feed-who">';
      html += post.avatar_url ? '<img class="avatar-sm" src="'+escapeHtml(post.avatar_url)+'" alt="">' : '';
      html += '<span class="feed-handle">@'+escapeHtml(post.handle)+'</span>';
      html += '</span>';
      html += '<span class="feed-time">'+timeAgo(post.detected_at)+'</span></div>';
      if(post.text_preview) html += '<div class="feed-text">'+escapeHtml(post.text_preview)+'</div>';
      html += '<a class="feed-link" href="'+escapeHtml(post.post_url)+'" target="_blank" rel="noopener">Zum Post →</a>';
      html += '</div>';
    });
    html += '</div>';
  }
  document.getElementById("app").innerHTML = html;
}

function renderWatchlist(){
  if(watchlistData === null){
    document.getElementById("app").innerHTML = '<div class="loading-wrap">Lädt Watchlist…</div>';
    loadWatchlist();
    return;
  }
  var html = "";
  html += '<div class="hero-line"><span class="eyebrow">Watchlist</span></div>';
  html += '<h1 class="hero-title">Deine Watchlist.</h1>';
  html += '<p class="hero-sub">Nur du siehst diese Liste. Erkannte Posts von deinen Profilen landen trotzdem im gemeinsamen Feed für den ganzen Discord.</p>';
  html += '<div class="panel">';
  html += '<div class="wl-form"><input class="wl-input" id="handleInput" type="text" placeholder="X-Handle oder Profil-Link, z. B. @elonmusk"><button class="btn" id="addBtn">Hinzufügen</button></div>';
  html += '<div class="wl-error" id="wlError"></div>';
  if(watchlistData.length === 0){
    html += '<div class="wl-empty">Noch keine Profile auf deiner Watchlist.</div>';
  } else {
    html += '<div class="wl-list">';
    watchlistData.forEach(function(row){
      html += '<div class="wl-row">';
      html += row.avatar_url ? '<img class="avatar-sm" src="'+escapeHtml(row.avatar_url)+'" alt="">' : '';
      html += '<span class="wl-handle">@'+escapeHtml(row.handle)+'</span>';
      html += '<button class="btn-ghost" data-remove="'+escapeHtml(row.handle)+'">Entfernen</button>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="panel sound-panel">';
  html += '<div class="sound-label">Ton bei neuen Posts — spielt nur, solange diese Seite offen ist, ersetzt nicht die Push-Benachrichtigung.</div>';
  html += '<div class="sound-options">';
  [["1","Ton 1"],["2","Ton 2"],["3","Ton 3"],["off","Aus"]].forEach(function(opt){
    var active = soundChoice === opt[0] ? " active" : "";
    html += '<button class="sound-btn'+active+'" data-sound="'+opt[0]+'">'+opt[1]+'</button>';
  });
  html += '</div></div>';

  document.getElementById("app").innerHTML = html;

  document.getElementById("addBtn").addEventListener("click", addProfile);
  document.getElementById("handleInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") addProfile();
  });
  document.querySelectorAll("[data-remove]").forEach(function(btn){
    btn.addEventListener("click", function(){ removeProfile(btn.dataset.remove); });
  });
  document.querySelectorAll("[data-sound]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var choice = btn.dataset.sound;
      setSoundChoice(choice);
      if(choice !== "off") playNotificationSound();
    });
  });
}

document.getElementById("logoBtn").addEventListener("click", function(){ setView(auth.user ? "feed" : "gate"); });
document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.addEventListener("click", function(){ setView(btn.dataset.view); });
});

function boot(){
  if(!sb){
    state.view = "gate";
    render();
    return;
  }
  sb.auth.onAuthStateChange(function(event, session){
    if(session && session.user){
      auth.user = session.user;
      subscribeFeed();
      checkPushState();
      loadMemberCount();
      setView("feed");
    } else if(event === "SIGNED_OUT" || event === "INITIAL_SESSION"){
      teardownSession();
      setView("gate");
    }
  });
}

render();
boot();
})();
</script>
</body>
</html>
